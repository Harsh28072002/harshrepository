name: Terraform CI

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Validation and Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3   

      - name: Terraform Init - PROD
        run: terraform -chdir=env/PROD init

      - name: Terraform Init - QA
        run: terraform -chdir=env/QA init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate - PROD
        run: terraform -chdir=env/PROD validate

      - name: Terraform Validate - QA
        run: terraform -chdir=env/QA validate

      - name: Terraform Plan - PROD
        run: terraform -chdir=env/PROD plan

      - name: Terraform Plan - QA
        run: terraform -chdir=env/QA plan